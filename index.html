
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Asti Aprilia Mustika</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5eee9;
            color: #333;
            padding: 30px;
        }

        .cv-container {
            max-width: 800px;
            margin: auto;
            background-color: white;
            display: flex;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        .sidebar {
            width: 35%;
            background-color: #704638;
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .sidebar img {
            width: 160px;
            height: 190px;
            object-fit: cover;
            object-position: center top;
            border-radius: 10px;
            border: 4px solid white;
            margin-bottom: 20px;
        }

        .sidebar h1 {
            font-size: 22px;
            margin-bottom: 25px;
        }

        .sidebar h2 {
            font-size: 17px;
            border-bottom: 2px solid #e8c5ae;
            padding-bottom: 8px;
            margin-bottom: 12px;
            text-align: left;
        }

        .sidebar p {
            font-size: 14px;
            line-height: 1.8;
            text-align: left;
            overflow-wrap: anywhere;
        }

        .main-content {
            width: 65%;
            padding: 35px 30px;
        }

        .main-content h2 {
            color: #704638;
            font-size: 21px;
            border-bottom: 2px solid #704638;
            padding-bottom: 10px;
            margin-bottom: 18px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section p {
            font-size: 15px;
            line-height: 1.8;
        }

        .section ul {
            padding-left: 22px;
        }

        .section li {
            font-size: 15px;
            line-height: 2;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .cv-container {
                flex-direction: column;
            }

            .sidebar,
            .main-content {
                width: 100%;
            }

            .sidebar img {
                width: 150px;
                height: 180px;
            }

            .main-content {
                padding: 25px 20px;
            }
        }

        @media print {
            body {
                padding: 0;
                background: white;
            }

            .cv-container {
                box-shadow: none;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <div class="cv-container">

        <aside class="sidebar">
            <img src="foto_asti.jpg" alt="Foto Asti Aprilia Mustika">

            <h1>Asti Aprilia Mustika</h1>

            <h2>Data Pribadi</h2>
            <p>
                <strong>Umur:</strong><br>
                17tahun
                <br><br>

                <strong>Alamat:</strong><br>
                Jln ciruum, kp bojong asih rt04/rw 05
                <br><br>

                <strong>Tanggal Lahir:</strong><br>
                Bandung, 01-04-2009
            </p>
        </aside>

        <main class="main-content">

            <div class="section">
                <h2>Hobby</h2>
                <ul>
                    <li>Memasak</li>
                    <li>Makan</li>
                </ul>
            </div>

            <div class="section">
                <h2>Pengalaman Berorganisasi atau Ekstrakurikuler</h2>
                <ul>
                    <li>Pencak Silat</li>
                    <li>Taekwondo</li>
                </ul>
            </div>

            <div class="section">
                <h2>Keahlian</h2>
                <ul>
                    <li>Tata Busana/Menjahit</li>
                </ul>
            </div>

        </main>

    </div>

</body>
</html>
